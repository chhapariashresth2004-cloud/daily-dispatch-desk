name: Run dispatcher step patch

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/run-dispatcher-step-patch.yml
      - apply_steps_for_github.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply dispatcher step edits
        run: |
          python apply_steps_for_github.py
          python -m py_compile server.py
          python - <<'PY'
          from pathlib import Path
          checks = {
              'index-step-tracker': 'dispatcherStepTracker' in Path('index.html').read_text(encoding='utf-8'),
              'app-step-function': 'updateDispatcherStepVisibility' in Path('app.js').read_text(encoding='utf-8'),
              'css-step-tracker': 'dispatcher-step-tracker' in Path('styles.css').read_text(encoding='utf-8'),
              'sw-cache': '20260606-dispatcher-steps' in Path('sw.js').read_text(encoding='utf-8'),
          }
          print(checks)
          if not all(checks.values()):
              raise SystemExit('Dispatcher step patch verification failed')
          PY

      - name: Commit patched app files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css sw.js
          if git diff --cached --quiet; then
            echo "No dispatcher step changes to commit"
          else
            git commit -m "Make dispatcher workflow step based"
            git push
          fi
