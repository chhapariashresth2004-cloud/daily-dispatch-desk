name: Apply dispatcher steps UI fix

on:
  push:
    branches: [main]
    paths:
      - apply_dispatcher_steps_fix.py
      - .github/workflows/apply-dispatcher-steps-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply dispatcher steps UI fix
        run: python apply_dispatcher_steps_fix.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css apply_dispatcher_steps_fix.py .github/workflows/apply-dispatcher-steps-fix.yml
          git commit -m "Fix dispatcher workflow steps UI" || exit 0
          git push
