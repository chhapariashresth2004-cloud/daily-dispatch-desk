name: Apply dispatcher step UI patch

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-dispatcher-steps.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply dispatcher step patch
        run: |
          cat > dispatcher-steps.patch <<'PATCH'
