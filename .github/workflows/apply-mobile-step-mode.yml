name: Apply dispatcher mobile step mode

on:
  push:
    branches: [main]
    paths:
      - apply_mobile_step_mode.py
      - .github/workflows/apply-mobile-step-mode.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply mobile step mode
        run: python apply_mobile_step_mode.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css apply_mobile_step_mode.py .github/workflows/apply-mobile-step-mode.yml
          git commit -m "Make dispatcher page one step at a time" || exit 0
          git push
